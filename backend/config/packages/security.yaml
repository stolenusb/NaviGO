security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User: 'auto'

    role_hierarchy:
        ROLE_ADMIN:       [ROLE_PARTNER, ROLE_CUSTOMER]
        ROLE_PARTNER:     [ROLE_USER]
        ROLE_CUSTOMER:    [ROLE_USER]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # 1. The Authentication Endpoint
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # 2. NEW BYPASS: Allows Swagger/Nelmio UI to load without checking for JWT
        api_doc:
            pattern: ^/api/(doc|docs)(/|$)|^/api$
            security: false

        # 3. Protected API Endpoints
        api:
            pattern: ^/api
            stateless: true
            jwt: ~
            logout:
                path: /api/logout

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/logout, roles: IS_AUTHENTICATED_FULLY }
        # Explicitly allow doc routes in case Symfony falls back here
        - { path: ^/api/(doc|docs), roles: PUBLIC_ACCESS }
        - { path: ^/api$, roles: PUBLIC_ACCESS }
        # Open up POST requests for registration so new users can sign up
        - { path: ^/api/customers, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/partners, roles: PUBLIC_ACCESS, methods: [POST] }
        # Public GET access for browsing trips, vehicles, cities, routes
        - { path: ^/api/trips, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/vehicles, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/cities, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/routes, roles: PUBLIC_ACCESS, methods: [GET] }
        # Secure the rest of the API
        - { path: ^/api,       roles: IS_AUTHENTICATED_FULLY }